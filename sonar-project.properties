# Análise do SonarQube Cloud (gratuito para repositório público).
#
# UM projeto para o monorepo inteiro, e não cinco. O design system é um produto
# só; cinco projetos dariam cinco painéis, cinco portões e nenhuma visão do
# conjunto — que é exatamente onde os defeitos desta casa moram, entre stacks.

sonar.projectKey=julianamucci_design-system
sonar.organization=julianamucci
sonar.projectName=Nortear Design System

sonar.sources=.
sonar.tests=.
# Só `*.test.*`: `*.spec.*` não casa um arquivo sequer nesta árvore, e padrão
# declarado que não casa nada é o começo do portão que encolhe em silêncio.
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx

# ── O QUE ESTA ANÁLISE NÃO OLHA ──────────────────────────────────────────────
#
# `.svelte` NÃO É ANALISADO. O SonarJS cobre `.ts`, `.tsx` e o componente de
# arquivo único do Vue (`.vue`); Svelte nunca entrou, e continua como pedido
# aberto na comunidade. Não há erro nem aviso: os arquivos simplesmente não
# entram na contagem.
#
# Medido em 2026-09-08, e o tamanho importa: a stack svelte tem 682 arquivos
# `.svelte` com 95.379 linhas invisíveis, contra 610 arquivos `.ts` com 96.687
# linhas que entram. É METADE de uma stack fora do relatório — e, pior, a
# métrica do projeto vai parecer saudável justamente por isso.
#
# Existe um contorno documentado (apontar o analisador de HTML para o sufixo
# `.svelte`) e ele foi RECUSADO: as regras de HTML não descrevem a sintaxe do
# Svelte, e o resultado seria um relatório cheio de achados que ninguém pode
# corrigir. Ponto cego declarado vale mais que ponto cego preenchido com ruído.

# O que não é código desta casa, ou não é código.
#
# `docs/shared/content/**` sai porque são 84 arquivos de tradução com ~1,7
# milhão de caracteres de PROSA em JSON. O analisador os leria como estrutura de
# dados, gastaria a maior parte do tempo neles e não teria nada a dizer.
sonar.exclusions=**/node_modules/**,\
  **/storybook-static/**,\
  **/dist/**,\
  **/coverage/**,\
  **/patches/**,\
  **/package-lock.json,\
  **/*.min.*,\
  docs/shared/content/**

# ── Duplicação ───────────────────────────────────────────────────────────────
#
# LEIA ISTO ANTES DE OLHAR O NÚMERO. As cinco stacks são implementações
# PARALELAS do mesmo design system, de propósito: a mesma story, a mesma docs
# page e o mesmo primitivo existem cinco vezes, e três delas (react, vanilla,
# angular) são TypeScript, então o detector as compara entre si. Duplicação alta
# aqui é a arquitetura, não defeito — e um portão que reprova a arquitetura é um
# portão que se aprende a ignorar.
#
# Ficam de fora do detector as três famílias em que a repetição é estrutural e
# não carrega decisão: as docs pages (84 por stack, mesmo esqueleto de seções),
# as stories e os construtores de snippet do painel Code.
#
# Fica DENTRO `src/components/ui/**`: ali a repetição dentro de uma mesma stack
# é sinal de verdade — é onde uma factory devia ter sido extraída.
sonar.cpd.exclusions=**/components/docs/**,\
  **/*.stories.*,\
  **/*.source.ts

# ── Cobertura ────────────────────────────────────────────────────────────────
#
# Os caminhos estão declarados, mas HOJE NÃO EXISTEM no CI: quem os produz é
# `npm run test:coverage`, e o workflow de testes ainda é informativo
# (`continue-on-error`), por decisão registrada no próprio test.yml. Enquanto
# isso, o Sonar reporta "sem dados de cobertura" — que é honesto — em vez de 0%,
# que seria mentira.
#
# Quando as suítes passarem a bloquear, é aqui que a cobertura entra: basta o
# job gerar os cinco `lcov.info`.
sonar.javascript.lcov.reportPaths=\
  nortear-design-system-react/coverage/lcov.info,\
  nortear-design-system-vue/coverage/lcov.info,\
  nortear-design-system-svelte/coverage/lcov.info,\
  nortear-design-system-vanilla/coverage/lcov.info,\
  nortear-design-system-angular/coverage/lcov.info

sonar.sourceEncoding=UTF-8
