<!-- GA4: o Measurement ID vem de STORYBOOK_GA_MEASUREMENT_ID (substituição %VAR%
     do Storybook), lida de .env.development / .env.production — arquivos locais,
     fora do git. Copie .env.example e preencha com a SUA propriedade GA4; sem eles
     o tracking é no-op (ver BRAND-CUSTOMIZATION.md, Etapa 7 — Analytics).
     GA4 vive no manager, não no iframe — ver docs/shared/guidelines/07-analytics.md -->
<script async src="https://www.googletagmanager.com/gtag/js?id=%STORYBOOK_GA_MEASUREMENT_ID%"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', '%STORYBOOK_GA_MEASUREMENT_ID%', {
    send_page_view: false  /* page_view manual enviado por useSeoEffect a cada troca de story */
  });
</script>
