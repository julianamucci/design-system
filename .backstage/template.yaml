apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: design-system-scaffold
  title: Design System — Multi-Stack
  description: >
    Template para criar um design system com documentação centralizada e suporte
    a múltiplos frameworks. Inclui Storybook, temas customizáveis e skills do
    Claude Code para continuar desenvolvendo com IA. Escolha uma ou mais stacks.
  tags:
    - design-system
    - frontend
    - component-library
    - storybook
    - react
    - vue
    - svelte
    - vanilla
    - claude-code

spec:
  owner: design-team
  type: library

  parameters:
    # ── Passo 1: Identidade do Projeto ──────────────────────────────────────
    - title: Identidade do Projeto
      required:
        - projectName
        - description
        - owner
        - displayName
      properties:
        projectName:
          type: string
          title: Nome do projeto (slug)
          description: Identificador único em kebab-case (ex. "minha-empresa-ds")
          pattern: '^[a-z0-9-]+$'
          ui:autofocus: true

        displayName:
          type: string
          title: Nome de exibição
          description: Nome legível para humanos (ex. "Minha Empresa Design System")

        description:
          type: string
          title: Descrição
          description: Breve descrição do design system

        owner:
          type: string
          title: Time responsável
          description: Squad ou time que mantém o projeto (ex. "squad-plataforma")

        gaId:
          type: string
          title: Google Analytics 4 Measurement ID (opcional)
          description: "Formato: G-XXXXXXXXXX. Deixe vazio para desativar analytics."
          pattern: '^(G-[A-Z0-9]+)?$'

    # ── Passo 2: Stacks ──────────────────────────────────────────────────────
    - title: Frameworks
      required:
        - stacks
      properties:
        stacks:
          type: array
          title: Stacks incluídas
          description: >
            Selecione uma ou mais. A documentação textual é idêntica em todos os
            frameworks — apenas os exemplos de código variam. Você pode adicionar
            mais stacks depois rodando o scaffolder novamente.
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
              - react
              - vue
              - svelte
              - basecoat
          ui:widget: checkboxes
          ui:enumNames:
            - "React 19 (shadcn/ui + Radix UI)"
            - "Vue 3 (shadcn-vue + Reka UI)"
            - "Svelte 5 (shadcn-svelte + Bits UI)"
            - "Basecoat — Vanilla TS (basecoat-css + Tailwind)"

        includeStorybook:
          type: boolean
          title: Incluir Storybook 10
          description: Interface principal de documentação e testes de componentes
          default: true

        includeChromatic:
          type: boolean
          title: Incluir Chromatic (visual regression)
          description: Captura visual de todos os stories para detectar regressões
          default: false

    # ── Passo 3: Repositório e Integrações ───────────────────────────────────
    - title: Repositório e Integrações
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repositório GitHub
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com

        includeBackstageIntegration:
          type: boolean
          title: Registrar no catálogo Backstage
          description: Cria catalog-info.yaml para aparecer no portal interno
          default: true

        includeClaudeSkills:
          type: boolean
          title: Incluir skills do Claude Code
          description: >
            Adiciona o diretório .claude/commands/ com as skills especializadas
            para criar componentes, documentação, testes, SEO e qualidade com IA.
            Requer Claude Code CLI (claude.ai/code).
          default: true

  steps:
    # ── Root: arquivos compartilhados entre todas as stacks ─────────────────
    - id: fetch-root
      name: Inicializar estrutura raiz
      action: fetch:template
      input:
        url: ./skeleton/root
        values:
          projectName: ${{ parameters.projectName }}
          displayName: ${{ parameters.displayName }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          gaId: ${{ parameters.gaId }}
          stacks: ${{ parameters.stacks }}
          includeStorybook: ${{ parameters.includeStorybook }}
          includeClaudeSkills: ${{ parameters.includeClaudeSkills }}
          year: ${{ '' | now('YYYY') }}

    # ── Skills do Claude Code ────────────────────────────────────────────────
    - id: fetch-claude-skills
      name: Copiar skills do Claude Code
      if: ${{ parameters.includeClaudeSkills }}
      action: fetch:plain
      input:
        url: ./skeleton/root/.claude
        targetPath: .claude

    # ── Stack: React ─────────────────────────────────────────────────────────
    - id: fetch-stack-react
      name: Adicionar stack React
      if: ${{ 'react' in parameters.stacks }}
      action: fetch:template
      input:
        url: ./skeleton/stacks/react
        targetPath: design-system-react
        values:
          projectName: ${{ parameters.projectName }}
          displayName: ${{ parameters.displayName }}
          description: ${{ parameters.description }}
          gaId: ${{ parameters.gaId }}
          includeChromatic: ${{ parameters.includeChromatic }}

    # ── Stack: Vue ───────────────────────────────────────────────────────────
    - id: fetch-stack-vue
      name: Adicionar stack Vue
      if: ${{ 'vue' in parameters.stacks }}
      action: fetch:template
      input:
        url: ./skeleton/stacks/vue
        targetPath: design-system-vue
        values:
          projectName: ${{ parameters.projectName }}
          displayName: ${{ parameters.displayName }}
          description: ${{ parameters.description }}
          gaId: ${{ parameters.gaId }}
          includeChromatic: ${{ parameters.includeChromatic }}

    # ── Stack: Svelte ────────────────────────────────────────────────────────
    - id: fetch-stack-svelte
      name: Adicionar stack Svelte
      if: ${{ 'svelte' in parameters.stacks }}
      action: fetch:template
      input:
        url: ./skeleton/stacks/svelte
        targetPath: design-system-svelte
        values:
          projectName: ${{ parameters.projectName }}
          displayName: ${{ parameters.displayName }}
          description: ${{ parameters.description }}
          gaId: ${{ parameters.gaId }}
          includeChromatic: ${{ parameters.includeChromatic }}

    # ── Stack: Basecoat ──────────────────────────────────────────────────────
    - id: fetch-stack-basecoat
      name: Adicionar stack Basecoat (Vanilla TS)
      if: ${{ 'basecoat' in parameters.stacks }}
      action: fetch:template
      input:
        url: ./skeleton/stacks/basecoat
        targetPath: design-system-basecoat
        values:
          projectName: ${{ parameters.projectName }}
          displayName: ${{ parameters.displayName }}
          description: ${{ parameters.description }}
          gaId: ${{ parameters.gaId }}
          includeChromatic: ${{ parameters.includeChromatic }}

    # ── Publicar no GitHub ───────────────────────────────────────────────────
    - id: publish
      name: Publicar repositório no GitHub
      action: publish:github
      input:
        allowedHosts:
          - github.com
        description: ${{ parameters.description }}
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: main
        repoVisibility: private
        gitCommitMessage: "chore: initialize design system from template"

    # ── Registrar no catálogo Backstage ──────────────────────────────────────
    - id: register
      name: Registrar no catálogo Backstage
      if: ${{ parameters.includeBackstageIntegration }}
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  output:
    links:
      - title: Repositório no GitHub
        url: ${{ steps['publish'].output.remoteUrl }}
        icon: github
      - title: Ver no catálogo Backstage
        if: ${{ parameters.includeBackstageIntegration }}
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
    text:
      - title: Próximos passos
        content: |
          ## Design System criado com sucesso! 🎉

          **Stacks incluídas:** ${{ parameters.stacks | join(', ') }}

          ### Instalar dependências
          ```bash
          {% for stack in parameters.stacks %}
          cd design-system-${{ stack }} && npm install && cd ..
          {% endfor %}
          ```

          ### Abrir o Storybook
          ```bash
          {% for stack in parameters.stacks %}
          npm run storybook:${{ stack }}   # http://localhost:6006
          {% endfor %}
          ```

          ### Customizar temas
          Edite `docs/shared/themes/` para ajustar as cores do seu produto.
          Cada tema é um arquivo `.css` com variáveis HSL.

          {% if parameters.includeClaudeSkills %}
          ### Usar as skills do Claude Code
          Abra o projeto no Claude Code e use `/pipeline new <componente>` para criar
          um novo componente com documentação completa em todas as stacks.
          {% endif %}
