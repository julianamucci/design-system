name: Tests (informative)

# Storybook Test (vitest browser mode + addon-vitest): play functions + axe
# (via addon-a11y com `a11y: { test: 'error' }` no preview) em todas as
# stories, sem precisar buildar/servir o Storybook.
#
# Atualmente INFORMATIVO: aparece no PR mas não bloqueia merge enquanto as
# stacks não estão em 100%. Quando todas chegarem a 100%, remover
# continue-on-error e adicionar ao branch protection.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  storybook-test:
    name: ${{ matrix.stack.name }}
    runs-on: ubuntu-latest
    # Permite que o job falhe sem reprovar o PR — é o que torna o workflow
    # "informativo". Quando os testes estiverem 100%, remover esta linha.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        stack:
          - { name: react,   dir: nortear-design-system-react }
          - { name: vue,     dir: nortear-design-system-vue }
          - { name: svelte,  dir: nortear-design-system-svelte }
          - { name: vanilla, dir: nortear-design-system-vanilla }

    defaults:
      run:
        working-directory: ${{ matrix.stack.dir }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ matrix.stack.dir }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Storybook tests (vitest)
        run: npm test

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.stack.name }}
          path: ${{ matrix.stack.dir }}/test-results
          retention-days: 14
          if-no-files-found: ignore

  summary:
    name: Test Summary
    needs: storybook-test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Status note
        run: |
          echo "## Test Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Este workflow é **informativo** — falhas aqui não bloqueiam merge." >> $GITHUB_STEP_SUMMARY
          echo "Runner: Storybook Test (vitest + addon-vitest + addon-a11y)." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Meta: 100% em todas as 4 stacks. Quando atingido, remover" >> $GITHUB_STEP_SUMMARY
          echo "\`continue-on-error: true\` e promover a check obrigatório." >> $GITHUB_STEP_SUMMARY
