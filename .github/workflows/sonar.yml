name: SonarQube (informative)

# Análise estática do monorepo inteiro num projeto só. A configuração — fontes,
# exclusões e o porquê da duplicação — vive em `sonar-project.properties`, na
# raiz, e não aqui: quem for entender o relatório vai procurar lá.
#
# NÃO BLOQUEIA MERGE, e isso NÃO se faz com `continue-on-error`.
#
# Havia um `continue-on-error: true` aqui, posto para o Quality Gate vermelho não
# reprovar o PR. Ele não protegia de nada: a action de scan só falha quando o
# SCAN falha — o gate vermelho só reprova a job se alguém pedir, com
# `sonar.qualitygate.wait` ou com a action separada de quality gate, e este
# arquivo não usa nenhuma das duas.
#
# O que ele fazia, de fato, era esconder quebra. MEDIDO em 2026-09-09: quatro
# pushes seguidos não produziram análise nenhuma — o painel ficou parado no
# commit 29eef558 — e o workflow aparecia verde. A job falhava e ninguém via.
#
# Sem ele, scan quebrado fica VERMELHO e visível, e o gate continua não
# bloqueando, que era o objetivo desde o começo.
#
# A causa provável daquelas falhas está do lado do Sonar, não daqui: com a
# Automatic Analysis LIGADA, a análise por CI é recusada. As duas não convivem,
# e desligar a automática em Administration > Analysis Method é o que libera
# esta.
#
# O CodeQL continua onde está e NÃO é substituído. Os dois se sobrepõem em
# segurança, e divergem no resto: o CodeQL segue fluxo de dados entre arquivos e
# é melhor em injeção; o Sonar mede manutenibilidade, duplicação e cobertura,
# que o CodeQL não olha.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: sonar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonar:
    name: Análise
    runs-on: ubuntu-latest

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # O Sonar precisa do histórico completo para saber o que é CÓDIGO
          # NOVO. Com o checkout raso ele não consegue datar as linhas, e a
          # análise de novo código — que é a que vale num PR — vira a análise do
          # repositório inteiro a cada vez.
          fetch-depth: 0

      - name: Setup Node 24
        if: env.SONAR_TOKEN != ''
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: nortear-design-system-*/package-lock.json

      - name: Dependências das cinco stacks
        # POR QUE INSTALAR NUMA JOB QUE SÓ ANALISA.
        #
        # A primeira análise fechou com o aviso "At least one
        # referenced/extended tsconfig.json was not found in the project".
        # A causa: `vue/tsconfig.app.json` estende `@vue/tsconfig` e
        # `svelte/tsconfig.json` estende `@tsconfig/svelte` — os dois vindos do
        # `node_modules`, que não existia aqui.
        #
        # E o aviso subestima o estrago. Sem `node_modules` o SonarJS não monta
        # o programa TypeScript, então as regras que dependem de TIPO são
        # puladas — nas cinco stacks, caladas, e a análise fica parecendo
        # completa. É o modo de falha que esta casa mais persegue: portão que
        # reporta sucesso sem ter medido.
        #
        # `--ignore-scripts` porque `postinstall` aqui é `patch-package`, e
        # patch de comportamento de runtime não muda o que o analisador lê.
        # Poupa tempo e tira uma fonte de falha que não diz nada sobre o código.
        if: env.SONAR_TOKEN != ''
        run: |
          for dir in nortear-design-system-*/; do
            echo "::group::npm ci — ${dir}"
            (cd "$dir" && npm ci --ignore-scripts)
            echo "::endgroup::"
          done

      - name: Análise
        # Sem a chave o passo é PULADO, não reprovado. Vale para dois casos
        # reais: antes de o segredo existir, e em PR vindo de fork, que por
        # desenho do GitHub não enxerga segredo nenhum. Falhar nesses dois seria
        # vermelho que não diz nada sobre o código.
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v6

      - name: Sem chave configurada
        if: env.SONAR_TOKEN == ''
        run: |
          {
            echo "## SonarQube: análise pulada"
            echo ""
            echo "O segredo \`SONAR_TOKEN\` não está configurado neste repositório"
            echo "(ou este PR vem de um fork, que não enxerga segredos)."
            echo ""
            echo "Para ligar: criar o projeto em https://sonarcloud.io ligado a"
            echo "este repositório e guardar o token em Settings > Secrets and"
            echo "variables > Actions, com o nome \`SONAR_TOKEN\`."
          } >> "$GITHUB_STEP_SUMMARY"
