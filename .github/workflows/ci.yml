name: CI

# Required checks: lint + typecheck + build-storybook em cada stack.
# Bloqueia merge se qualquer um falhar.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela builds antigos quando há novo push na mesma branch/PR
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.stack.name }}
    runs-on: ubuntu-latest
    strategy:
      # Não aborta os outros se uma stack falha — quero ver tudo
      fail-fast: false
      matrix:
        stack:
          - { name: react,   dir: nortear-design-system-react }
          - { name: vue,     dir: nortear-design-system-vue }
          - { name: svelte,  dir: nortear-design-system-svelte }
          - { name: vanilla, dir: nortear-design-system-vanilla }
          - { name: angular, dir: nortear-design-system-angular }

    defaults:
      run:
        working-directory: ${{ matrix.stack.dir }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ matrix.stack.dir }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `tsc` / `vue-tsc -b` / `svelte-check` / `ngc --noEmit`, conforme a stack.
      #
      # O cabeçalho deste arquivo prometia typecheck desde sempre e o passo nunca
      # existiu. Medido em 2026-09-08 plantando `const x: number = "texto"` no
      # fim de `api/perguntar.ts` do vanilla: `npm run lint` fechou exit 0 com
      # zero erros, e `build-storybook` nem abre o arquivo, porque nenhuma story
      # importa `api/`. As ~900 linhas do servidor do chat eram checadas por
      # NADA. Só o `tsc` viu (exit 2, TS2322).
      #
      # Custo a frio, medido na máquina local: react 117s, vue 140s, svelte
      # 319s, vanilla 46s, angular 94s. Como a matriz roda uma job por stack, o
      # relógio de cada job cresce só o próprio número.
      - name: Typecheck
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook
        env:
          # Storybook 10 + Rolldown ocasionalmente excede 4GB heap default
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Upload Storybook artifact
        uses: actions/upload-artifact@v5
        with:
          name: storybook-${{ matrix.stack.name }}
          path: ${{ matrix.stack.dir }}/storybook-static
          retention-days: 7
          if-no-files-found: error

  # Job final que depende de todos os builds — usado como check required no branch protection
  ci-success:
    name: CI Success
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all stack builds passed
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error::Pelo menos uma stack falhou no build"
            exit 1
          fi
          echo "✅ Todas as 5 stacks passaram em lint + build-storybook"
