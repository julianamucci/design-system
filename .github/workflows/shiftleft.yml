---
# This workflow integrates Harness SAST and SCA (Qwiet AI) with GitHub
# Visit https://docs.shiftleft.io for help
name: Harness SAST and SCA

on:
  pull_request:
  workflow_dispatch:

jobs:
  NextGen-Static-Analysis:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Setup Java JDK v8
      uses: actions/setup-java@v4
      with:
        distribution: zulu
        java-version: 8

    - name: Setup Node 22
      uses: actions/setup-node@v5
      with:
        node-version: '22'

    # Instala as dependências ANTES da análise: sem node_modules o motor de
    # taint não resolve imports de terceiros (ex: dompurify) e não consegue
    # aplicar as políticas de sanitizador — todo innerHTML sanitizado via
    # DOMPurify.sanitize() continuaria sendo reportado como XSS.
    # --ignore-scripts: não precisamos de postinstall (patch-package) pra
    # análise estática, e evita executar scripts de terceiros no CI.
    - name: Install dependencies (needed for taint resolution)
      run: |
        for dir in design-system-react design-system-vue design-system-svelte nortear-design-system nortear-cli; do
          (cd "$dir" && npm ci --ignore-scripts --no-audit --no-fund)
        done

    - name: Download Harness SAST and SCA CLI
      run: |
        curl https://cdn.shiftleft.io/download/sl > ${GITHUB_WORKSPACE}/sl && chmod a+rx ${GITHUB_WORKSPACE}/sl

    - name: Static Analysis
      run: |
        ${GITHUB_WORKSPACE}/sl --version
        ${GITHUB_WORKSPACE}/sl analyze --strict --wait \
          --app design-system \
          --tag branch=${{ github.head_ref }} \
          --js $(pwd) -- --ts
      env:
        SHIFTLEFT_ACCESS_TOKEN: ${{ secrets.SHIFTLEFT_ACCESS_TOKEN }}
        SHIFTLEFT_API_HOST: www.shiftleft.io
        SHIFTLEFT_GRPC_TELEMETRY_HOST: telemetry.shiftleft.io:443
        SHIFTLEFT_GRPC_API_HOST: api.shiftleft.io:443

  Build-Rules:
    # Posta as findings do Static Analysis como comentário no PR.
    # Só faz sentido em pull_request — workflow_dispatch não tem PR number.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions: write-all
    needs: NextGen-Static-Analysis
    steps:
    - uses: actions/checkout@v5
    - name: Download Harness SAST and SCA CLI
      run: |
        curl https://cdn.shiftleft.io/download/sl > ${GITHUB_WORKSPACE}/sl && chmod a+rx ${GITHUB_WORKSPACE}/sl
    - name: Validate Build Rules
      run: |
        ${GITHUB_WORKSPACE}/sl check-analysis --app design-system \
            --github-pr-number=${{ github.event.number }} \
            --github-pr-user=${{ github.repository_owner }} \
            --github-pr-repo=${{ github.event.repository.name }} \
            --github-token=${{ secrets.GITHUB_TOKEN }}
      env:
        SHIFTLEFT_ACCESS_TOKEN: ${{ secrets.SHIFTLEFT_ACCESS_TOKEN }}
        SHIFTLEFT_API_HOST: www.shiftleft.io
        SHIFTLEFT_GRPC_TELEMETRY_HOST: telemetry.shiftleft.io:443
        SHIFTLEFT_GRPC_API_HOST: api.shiftleft.io:443
