# Dependabot — SCA (dependências vulneráveis) + atualizações de segurança.
# Substitui a parte de SCA do Qwiet AI (ver CONTRIBUTING.md).
#
# - Security updates: PRs automáticos assim que uma CVE é publicada para uma
#   dependência dos lockfiles (não depende do schedule abaixo)
# - Version updates: PRs semanais agrupados, só patch/minor, para manter as
#   deps frescas sem enxurrada de PRs

version: 2
updates:
  - package-ecosystem: npm
    directory: /design-system-react
    schedule:
      interval: weekly
      day: monday
    groups:
      react-deps:
        patterns: ["*"]
        update-types: [minor, patch]
    open-pull-requests-limit: 3

  - package-ecosystem: npm
    directory: /design-system-vue
    schedule:
      interval: weekly
      day: monday
    groups:
      vue-deps:
        patterns: ["*"]
        update-types: [minor, patch]
    open-pull-requests-limit: 3

  - package-ecosystem: npm
    directory: /design-system-svelte
    schedule:
      interval: weekly
      day: monday
    groups:
      svelte-deps:
        patterns: ["*"]
        update-types: [minor, patch]
    open-pull-requests-limit: 3

  - package-ecosystem: npm
    directory: /nortear-design-system
    schedule:
      interval: weekly
      day: monday
    groups:
      vanilla-deps:
        patterns: ["*"]
        update-types: [minor, patch]
    open-pull-requests-limit: 3

  - package-ecosystem: npm
    directory: /nortear-cli
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
